[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aerobrowse"
version = "0.2.0"
description = "Hybrid HTTP and isolated Chromium browsing for AI agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kartik", email = "k39139215@gmail.com" }]
license = { text = "MIT" }
keywords = [
    "ai-browser",
    "mcp",
    "model-context-protocol",
    "cursor-mcp",
    "claude-desktop",
    "token-optimization",
    "playwright",
    "headless-browser",
    "web-scraping",
    "llm-agents",
    "ai-agents",
    "langchain",
    "crewai",
    "llamaindex",
    "set-of-marks",
    "fastmcp",
    "browser-automation",
    "rag"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "beautifulsoup4>=4.14,<5",
    "idna>=3.11,<4",
    "tiktoken>=0.12,<1",
    "playwright>=1.62,<2",
    "fastmcp>=3.4.4,<4",
    "psutil>=7.2,<8",
]

[project.urls]
Homepage = "https://github.com/k39139215-gif/aerobrowse"
Documentation = "https://github.com/k39139215-gif/aerobrowse#readme"
Repository = "https://github.com/k39139215-gif/aerobrowse.git"
Issues = "https://github.com/k39139215-gif/aerobrowse/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.14",
    "mypy>=1.19",
    "types-beautifulsoup4",
    "pip-audit>=2.9",
    "build>=1.3",
    "setuptools>=80,<100",
    "wheel>=0.45,<1",
    "pytest-asyncio>=0.23.0",
    "psutil>=5.9.0",
]

[project.scripts]
aerobrowse = "aerobrowse.cli:main"
aero = "aerobrowse.cli:main"

[tool.setuptools.packages.find]
include = ["aerobrowse*"]
[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = ["browser: requires isolated Linux Chromium", "native_contract: requires built Rust binary in AEROBROWSE_NATIVE_BINARY"]

[tool.setuptools.package-data]
aerobrowse = ["action_runtime.js", "token_data/*.gz", "token_data/*.json", "token_data/LICENSE"]
