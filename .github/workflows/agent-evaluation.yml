name: Opt-in actual model evaluation
on:
  workflow_dispatch:
    inputs:
      max_calls:
        description: Maximum tool calls per task (1 to 100)
        required: true
        default: "50"
        type: string
permissions:
  contents: read
concurrency:
  group: agent-evaluation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked --extra dev --no-build --no-install-project
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: uv run --no-sync playwright install --with-deps chromium
      - name: Provision disposable Linux isolation prerequisites
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user --net -- python -c "import socket; assert socket.if_nameindex() == [(1, 'lo')]"
          sudo mkdir /sys/fs/cgroup/aerobrowse-ci
          sudo sh -c 'echo "+cpu +memory +pids" > /sys/fs/cgroup/cgroup.subtree_control'
          sudo sh -c 'echo "+cpu +memory +pids" > /sys/fs/cgroup/aerobrowse-ci/cgroup.subtree_control'
          sudo mkdir /sys/fs/cgroup/aerobrowse-ci/driver
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/aerobrowse-ci
          echo AEROBROWSE_CGROUP_ROOT=/sys/fs/cgroup/aerobrowse-ci >> "$GITHUB_ENV"
      - name: Run independently judged tasks against the configured model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AEROBROWSE_EVAL_MODEL: ${{ vars.AEROBROWSE_EVAL_MODEL }}
        run: |
          if [ -z "$OPENAI_API_KEY" ] || [ -z "$AEROBROWSE_EVAL_MODEL" ]; then
            echo "Configure the OPENAI_API_KEY secret and AEROBROWSE_EVAL_MODEL variable before dispatch."
            exit 2
          fi
          bash scripts/ci-in-quota.sh "$PWD/.venv/bin/python" -m benchmarks.agent.run --max-calls "${{ inputs.max_calls }}" --output evidence/agent/model-evaluation.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: actual-model-evaluation
          path: evidence/agent/model-evaluation.json
