[package]
name = "aerobrowse"
version = "0.1.0"
edition = "2021"
authors = ["Kartik <k39139215@gmail.com>"]
description = "The Featherweight AI Browser Engine in Rust — 100% Web Compatibility at 30MB Memory with 90% Fewer Tokens"
license = "MIT"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli"] }
scraper = "0.19"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
