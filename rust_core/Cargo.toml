[package]
name = "aerobrowse"
version = "0.2.0"
edition = "2021"
authors = ["Kartik <k39139215@gmail.com>"]
description = "The Featherweight AI Browser Engine in Rust â€” 100% Web Compatibility with 90% Fewer Tokens"
license = "MIT"
repository = "https://github.com/k39139215-gif/aerobrowse"
keywords = ["ai-browser", "mcp", "headless-browser", "token-optimizer", "web-scraping"]
categories = ["web-programming", "command-line-utilities"]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
scraper = "0.19"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ego-tree = "0.6"
url = "2.5.9"
tiktoken-rs = "0.12.1"
