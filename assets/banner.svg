<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="brand-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#00d9f5" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e33" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0c1322" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0077ff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="480" fill="url(#bg-grad)" />

  <!-- Grid Tech Lines -->
  <g stroke="#1a2744" stroke-width="1" opacity="0.4">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="800" y1="0" x2="800" y2="480" />
    <line x1="1000" y1="0" x2="1000" y2="480" />
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="150" cy="100" r="180" fill="url(#glow-grad)" filter="url(#neon-glow)" />
  <circle cx="1050" cy="380" r="220" fill="url(#glow-grad)" filter="url(#neon-glow)" />

  <!-- Top Status Badge -->
  <g transform="translate(60, 52)">
    <rect width="260" height="32" rx="16" fill="#14213d" stroke="#00d9f5" stroke-width="1" />
    <circle cx="18" cy="16" r="5" fill="#00f5a0" filter="url(#neon-glow)" />
    <text x="32" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">DUAL-ENGINE AI BROWSER</text>
  </g>

  <!-- Title & Headline -->
  <g transform="translate(60, 135)">
    <!-- Electric Icon -->
    <path d="M0,28 L24,0 L16,36 L36,36 L6,72 L12,42 Z" fill="url(#brand-cyan)" filter="url(#neon-glow)" />
    <!-- Brand Title -->
    <text x="50" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" letter-spacing="-1">AeroBrowse</text>
    <!-- Subtitle -->
    <text x="2" y="94" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
      The Featherweight AI Browser Engine for Autonomous Agents &amp; LLMs
    </text>
  </g>

  <!-- 3 Performance Pillars / Cards -->
  <!-- Card 1: Token Pruning -->
  <g transform="translate(60, 275)" filter="url(#card-shadow)">
    <rect width="335" height="150" rx="12" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.5" />
    <rect width="335" height="4" rx="2" fill="url(#brand-cyan)" />
    <text x="24" y="44" fill="#00f5a0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">88% Fewer Tokens</text>
    <text x="24" y="74" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Recursive Semantic AST Pruning</text>
    <text x="24" y="102" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">Eliminates CSS/SVG markup bloat while</text>
    <text x="24" y="122" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">preserving 95%+ visible vocabulary.</text>
  </g>

  <!-- Card 2: Memory & Speed -->
  <g transform="translate(432, 275)" filter="url(#card-shadow)">
    <rect width="335" height="150" rx="12" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.5" />
    <rect width="335" height="4" rx="2" fill="#38bdf8" />
    <text x="24" y="44" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">12MB RAM &amp; &lt;100ms</text>
    <text x="24" y="74" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Turbo Mode (Rust + Python)</text>
    <text x="24" y="102" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">15x lighter than headless Chrome.</text>
    <text x="24" y="122" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">Auto-routes to CDP on dynamic SPAs.</text>
  </g>

  <!-- Card 3: Set of Marks & MCP -->
  <g transform="translate(805, 275)" filter="url(#card-shadow)">
    <rect width="335" height="150" rx="12" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.5" />
    <rect width="335" height="4" rx="2" fill="#a855f7" />
    <text x="24" y="44" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Set-of-Marks &amp; MCP</text>
    <text x="24" y="74" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Zero Selector Hallucinations</text>
    <text x="24" y="102" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">Numbered IDs ([1] Click, [2] Fill).</text>
    <text x="24" y="122" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">Native FastMCP for Cursor &amp; Claude.</text>
  </g>
</svg>
